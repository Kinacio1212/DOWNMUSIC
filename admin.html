<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - DOWNMUSIC</title>
    <link rel="shortcut icon" href="icon/fone-de-ouvido.png" type="image/x-icon">
    <link rel="stylesheet" href="css/painel.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>🎚️ Painel de Administração</h1>
        <p>Gerencie as músicas do seu site</p>
    </header>

    <main>
        <section class="formulario">
        <h2>➕ Adicionar Música</h2>

        <label>Nome da Música:</label>
        <input type="text" id="nomeMusica" placeholder="Ex: Meu Som Favorito">

        <label>Link da Música (MP3):</label>
        <input type="text" id="linkMusica" placeholder="Ex: https://.../musica.mp3">

        <label>Link da Capa (Opcional):</label>
        <input type="text" id="linkCapa" placeholder="Ex: https://.../capa.jpg"> 

        <button id="adicionarMusica">Adicionar</button>
        <p id="mensagem"></p>

        <hr>
        <h3>🎶 Músicas Cadastradas</h3>
        <ul id="listaAdmin"></ul>
        </section>
    </main>

    <footer>
        <a href="index.html" class="botao-download">⬅️ Voltar ao site</a>
    </footer>
</body>
</html>
